name: Test Z80 Plugin

on:
  push:
    branches: [ main, master, develop, opcode_bundle_2-master ]
  pull_request:
    branches: [ main, master, opcode_bundle_2-master ]
  workflow_dispatch:

env:
  FORCE_BINJA_MOCK: 1

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        enable-cache: true
        cache-dependency-glob: "pyproject.toml"

    - name: Set up Python ${{ matrix.python-version }}
      run: |
        uv python install ${{ matrix.python-version }}
        uv python pin ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        uv sync --dev

    - name: Debug Ruff config and version
      run: |
        uvx --from ruff==0.6.4 ruff --version
        uvx --from ruff==0.6.4 ruff check --config ./pyproject.toml --show-settings | head -20
        
    - name: Lint with ruff (pinned version, explicit config)
      run: |
        uvx --from ruff==0.6.4 ruff check --config ./pyproject.toml . --output-format=github
        uvx --from ruff==0.6.4 ruff format --config ./pyproject.toml . --check

    - name: Type check with mypy
      run: |
        uv run mypy . --junit-xml=mypy-junit.xml || true
      continue-on-error: true

    - name: Test with pytest
      run: |
        uv run pytest -v --cov --cov-report=xml --cov-report=term --junit-xml=pytest-junit.xml

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-py${{ matrix.python-version }}
        path: |
          pytest-junit.xml
          mypy-junit.xml
          coverage.xml
          htmlcov/

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      if: matrix.python-version == '3.11'
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-py${{ matrix.python-version }}
        fail_ci_if_error: false

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v4

    - name: Set up Python (for runtime; uvx handles tools)
      run: |
        uv python install 3.11
        uv python pin 3.11
        python --version

    - name: Build sdist and wheel
      run: |
        # Use uvx for ephemeral build tools - no venv needed
        uvx --from build pyproject-build --sdist --wheel --outdir dist

    - name: Verify artifacts with Twine
      run: |
        uvx --from twine twine check dist/*

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'